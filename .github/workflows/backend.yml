name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # The assistant targets Windows (Win32 focus/automation, Credential Manager),
    # and so does its suite.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-timeout
      - name: Test suite (each file isolated; real-browser tests quarantined)
        run: python tests/_baseline_runner.py
      - name: Upload per-file report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          path: backend/tests/_baseline_report.txt
